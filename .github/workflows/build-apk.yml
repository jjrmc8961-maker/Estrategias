name: Compilar APK Android

on:
  push:
    branches: [ main, principal ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias y empaquetar web
        run: |
          npm install
          npm run build

      - name: Generar proyecto Android con Capacitor
        run: |
          npx cap add android
          npx cap sync android

      - name: Compilar APK Debug instalable
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: Estrategias-Guardias-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
